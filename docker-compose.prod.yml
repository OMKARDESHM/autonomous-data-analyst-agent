version: '3.8'
services:
  web:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - DATABASE_URL=${DATABASE_URL}
      - STREAMLIT_AUTH_TOKEN=${STREAMLIT_AUTH_TOKEN}
      - UPLOADS_DIR=/data/uploads
    volumes:
      - uploads_data:/data/uploads

volumes:
  uploads_data:
    driver: local
